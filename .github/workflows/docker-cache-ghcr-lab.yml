name: Docker Cache + GHCR Lab

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # =================================
  # JOB 1: BUILD (with layer caching)
  # =================================
  build:
    runs-on: ubuntu-latest
    # Expose the step output as a job output so other jobs can read it
    outputs:
      image_tag: ${{ steps.generate.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image Tag
        id: generate
        run: echo "image_tag=app:v1.0" >> "$GITHUB_OUTPUT"

      - name: Build image (restore + save layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.generate.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Display Image Tag
        run: echo "The image is ${{ steps.generate.outputs.image_tag }}"

  # =================================
  # JOB 2: SECURITY
  # =================================
  security:
    needs: build
    runs-on: ubuntu-latest
    # Expose this job's scan result as a job output for the publish job
    outputs:
      scan_result: ${{ steps.scan.outputs.scan_result }}
    steps:
      - name: Security Scan
        id: scan
        run: |
          echo "Scanning image: ${{ needs.build.outputs.image_tag }}"
          echo "scan_result=PASS" >> "$GITHUB_OUTPUT"

  # =================================
  # JOB 3: PUBLISH (security gate)
  # =================================
  publish:
    needs: [build, security]
    # Job-level gate: only run publish if security's job output was PASS
    if: needs.security.outputs.scan_result == 'PASS'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute GHCR image reference
        id: ref
        run: |
          # GHCR requires a lowercase repo path.
          IMAGE_NAME_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          # The job output "app:v1.0" already contains a colon, so it can't
          # be appended after another colon (that would produce the invalid
          # tag "...:app:v1.0"). Turn it into a valid tag suffix instead:
          # "app:v1.0" -> "app-v1.0".
          TAG_SUFFIX=$(echo "${{ needs.build.outputs.image_tag }}" | tr ':' '-')

          VERSIONED="${{ env.REGISTRY }}/${IMAGE_NAME_LC}:${TAG_SUFFIX}"
          echo "versioned=$VERSIONED" >> "$GITHUB_OUTPUT"

          # Extension: also push :latest, but only on main.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            LATEST="${{ env.REGISTRY }}/${IMAGE_NAME_LC}:latest"
            echo "tags=$VERSIONED,$LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$VERSIONED" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image to GHCR (cache hit = fast rebuild)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
