name: Docker Cache + GHCR Lab
on:
  workflow_dispatch: null
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.generate.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate Image Tag
        id: generate
        run: echo "image_tag=app:v1.0" >> "$GITHUB_OUTPUT"
      - name: Build image (restore + save layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.generate.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Display Image Tag
        run: echo "The image is ${{ steps.generate.outputs.image_tag }}"

  security:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      scan_result: ${{ steps.scan.outputs.scan_result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ needs.build.outputs.image_tag }}
          cache-from: type=gha
      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build.outputs.image_tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Set scan result
        id: scan
        if: always()
        run: |
          if [ "${{ steps.trivy.outcome }}" = "success" ]; then
            echo "scan_result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "scan_result=FAIL" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs:
      - build
      - security
    if: needs.security.outputs.scan_result == 'PASS'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute GHCR image reference
        id: ref
        run: |
          # GHCR requires a lowercase repo path.
          IMAGE_NAME_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          # The job output "app:v1.0" already contains a colon, so it can't
          # be appended after another colon (that would produce the invalid
          # tag "...:app:v1.0"). Turn it into a valid tag suffix instead:
          # "app:v1.0" -> "app-v1.0".
          TAG_SUFFIX=$(echo "${{ needs.build.outputs.image_tag }}" | tr ':' '-')

          VERSIONED="${{ env.REGISTRY }}/${IMAGE_NAME_LC}:${TAG_SUFFIX}"
          echo "versioned=$VERSIONED" >> "$GITHUB_OUTPUT"

          # Extension: also push :latest, but only on main.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            LATEST="${{ env.REGISTRY }}/${IMAGE_NAME_LC}:latest"
            echo "tags=$VERSIONED,$LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$VERSIONED" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image to GHCR (cache hit = fast rebuild)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
