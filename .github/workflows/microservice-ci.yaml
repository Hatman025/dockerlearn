# Reusable workflow, called at job level from ci-trigger.yaml via

name: microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string


permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microservices-demo/${{ inputs.service }}:sha-${{ github.sha }}

    steps:
      
      # Checkout source
     
      - name: Checkout code
        uses: actions/checkout@v4

      
      # Docker Buildx 
     
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

     
      # Login to GHCR
     
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

     
      # Resolve build context
      
      - name: Resolve build context
        id: ctx
        run: |
          # cartservice's Dockerfile and .csproj live one level deeper
          # (src/cartservice/src) than every other service (src/<service>).
          if [ "${{ inputs.service }}" = "cartservice" ]; then
            echo "path=src/cartservice/src" >> "$GITHUB_OUTPUT"
          else
            echo "path=src/${{ inputs.service }}" >> "$GITHUB_OUTPUT"
          fi

      
      # Build Docker image (cached), loaded locally for the scan step
    
      - name: Build Image
        run: |
          docker buildx build \
            --cache-from=type=gha,scope=${{ inputs.service }} \
            --cache-to=type=gha,mode=max,scope=${{ inputs.service }} \
            --load \
            -t "$IMAGE_NAME" \
            "${{ steps.ctx.outputs.path }}"

      
      # Security Scan (before push)
    
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          severity: HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library

    
      # Push image (only if scan passes)
  
      - name: Push Image
        run: |
          docker push "$IMAGE_NAME"
